<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2c0f4e">
<title>Oráculos del Dharma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2c0f4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oráculos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  html,body{margin:0}

  /* Diseño: cabecera cósmica a sangre con el título sobre el resplandor; debajo, banda morada con dos carruseles tipo Netflix. */
  :root {
    --morado: #2c0f4e;
    --morado-hondo: #1d0838;
    --morado-panel: #3d1868;
    --lila: #cdb0ff;
    --oro: #f4d47c;
    --oro-hondo: #c99a2e;
    --texto: #fbf7ff;
    --texto-suave: #e0d2f5;
    --verde: #9fe3b8;
    --lila-claro: #c592ff;
    --f-display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    --f-lirica: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    color-scheme: dark;
  }
  html, body { background: var(--morado); }
  body {
    color: var(--texto);
    font-family: var(--f-display);
    font-size: 16px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }

  /* ================= CABECERA (vídeo en bucle) ================= */
  .cabecera {
    position: relative; width: 100%; aspect-ratio: 2.5 / 1; max-height: 560px;
    background: var(--morado-hondo) url('img/cabecera-poster.jpg') center / cover no-repeat;
    overflow: hidden;
  }
  .cabecera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cabecera::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 16%;
    background: linear-gradient(to bottom, rgba(44,15,78,0) 0%, var(--morado) 100%);
    pointer-events: none;
  }

  /* ================= CATÁLOGO ================= */
  .catalogo {
    position: relative;
    background:
      radial-gradient(1200px 500px at 15% 0%, rgba(150, 90, 230, 0.22), transparent 70%),
      radial-gradient(900px 600px at 100% 100%, rgba(120, 40, 160, 0.25), transparent 70%),
      var(--morado);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(34px, 5vw, 58px) 56px;
    min-height: 50vh;
  }
  .catalogo-interior { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 38px; }

  .fila-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .fila-titulo {
    margin: 0; font-size: clamp(19px, 2.3vw, 25px); font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; color: #f05bd8; text-wrap: balance;
    background: linear-gradient(95deg, #ff5fc8 0%, #e046f0 45%, #a64dff 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 14px rgba(224, 70, 240, 0.35));
    display: flex; align-items: baseline; gap: 12px;
  }
  .fila-titulo small { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--lila); -webkit-text-fill-color: var(--lila); }
  .fila-controles { display: flex; gap: 8px; align-items: center; }

  .flecha {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(244,212,124,0.45);
    background: rgba(29,8,56,0.6); color: var(--oro); cursor: pointer; display: grid; place-items: center;
    transition: background .2s, transform .2s;
  }
  .flecha:hover { background: var(--oro); color: var(--morado-hondo); }
  .flecha svg { width: 20px; height: 20px; fill: currentColor; }
  .flecha:disabled { opacity: .3; cursor: default; background: rgba(29,8,56,0.6); color: var(--oro); }

  .btn-licencia {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #f7e2a0 0%, var(--oro) 45%, var(--oro-hondo) 100%);
    color: #2a1405; border: none; border-radius: 999px; padding: 10px 18px;
    font-size: 14px; font-weight: 800; letter-spacing: 0.04em; cursor: pointer;
    box-shadow: 0 6px 18px rgba(201,154,46,0.35); transition: transform .2s, filter .2s;
  }
  .btn-licencia:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn-licencia svg { width: 17px; height: 17px; fill: currentColor; }

  .carrusel {
    display: flex; gap: 18px; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity; scroll-behavior: smooth;
    padding: 10px 4px 18px; margin: 0 -4px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab;
  }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel.arrastrando { cursor: grabbing; scroll-behavior: auto; scroll-snap-type: none; }

  .tarjeta {
    flex: 0 0 auto; width: clamp(140px, 15vw, 182px); scroll-snap-align: start;
    background: none; border: none; padding: 0; color: inherit; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; gap: 10px;
  }
  .tarjeta-media {
    position: relative; width: 100%; aspect-ratio: 2 / 3; max-width: 100%; box-sizing: border-box;
    border-radius: 12px; overflow: hidden;
    border: 2px solid rgba(244,212,124,0.35);
    box-shadow: 0 12px 26px rgba(10, 2, 24, 0.55);
    transition: transform .3s cubic-bezier(.25,1,.5,1), border-color .3s, box-shadow .3s;
    background: var(--morado-hondo);
  }
  .tarjeta:hover .tarjeta-media, .tarjeta:focus-visible .tarjeta-media { transform: translateY(-6px) scale(1.03); border-color: var(--oro); box-shadow: 0 18px 34px rgba(10,2,24,0.7); }
  .tarjeta-media img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tarjeta-nombre { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.3; color: var(--texto); }
  .tarjeta-sub { font-family: var(--f-lirica); font-style: italic; font-size: 16px; color: var(--texto-suave); margin-top: -6px; }

  /* Portadas de los oráculos aún vacíos */
  .portada-vacia {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 16px; text-align: center;
    background:
      radial-gradient(circle at 50% 38%, rgba(244,212,124,0.22), transparent 55%),
      linear-gradient(160deg, var(--tono, #4b1d7a), var(--morado-hondo));
  }
  .portada-vacia::before { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(244,212,124,0.45); border-radius: 8px; }
  .portada-vacia svg { width: 44px; height: 44px; fill: none; stroke: var(--oro); stroke-width: 1.2; }
  .portada-vacia span { font-family: var(--f-lirica); font-size: 19px; line-height: 1.15; color: var(--texto); font-weight: 600; }

  .sello {
    position: absolute; left: 8px; top: 8px; z-index: 2;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 5px 9px; border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .sello svg { width: 12px; height: 12px; fill: currentColor; }
  .sello-abierto { background: rgba(20, 60, 40, 0.8); color: var(--verde); }
  .sello-coleccion { background: rgba(20, 60, 40, 0.8); color: var(--verde); }
  .sello-muestra { background: rgba(29, 8, 56, 0.85); color: var(--lila); }
  .sello-pronto { background: rgba(29, 8, 56, 0.85); color: var(--texto-suave); font-size: 9.5px; padding: 4px 8px; }

  .divisoria {
    height: 1px; width: 100%; border: 0; margin: 0;
    background: linear-gradient(90deg, rgba(190,140,255,0) 0%, rgba(190,140,255,0.75) 50%, rgba(190,140,255,0) 100%);
    box-shadow: 0 0 12px rgba(190,140,255,0.35);
  }

  .sello-conseguir {
    position: static; align-self: center; font-size: 12px; padding: 6px 14px; letter-spacing: .1em;
    background: linear-gradient(135deg, #ff4d5e, #d0142c); color: #fff; text-decoration: none;
    box-shadow: 0 4px 12px rgba(208,20,44,0.45); transition: filter .2s, transform .2s;
  }
  .sello-conseguir:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .hueco {
    flex: 0 0 auto; width: clamp(150px, 15vw, 182px); scroll-snap-align: start;
    display: flex; flex-direction: column; gap: 10px; text-align: center;
  }
  .hueco-media {
    position: relative; width: 100%; aspect-ratio: 2 / 3; max-width: 100%; box-sizing: border-box;
    border-radius: 12px; border: 2px dashed rgba(205,176,255,0.5);
    background:
      radial-gradient(circle at 50% 35%, rgba(205,176,255,0.14), transparent 60%),
      rgba(29, 8, 56, 0.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 16px 12px;
  }
  .hueco-texto { font-size: 14px; line-height: 1.45; color: var(--texto-suave); }
  .btn-activar {
    background: linear-gradient(135deg, #fff0b0 0%, #ffd94d 45%, #e6a800 100%); color: #2a1405;
    border: none; border-radius: 999px; padding: 6px 14px; font-size: 11.5px; font-weight: 800; letter-spacing: .1em;
    cursor: pointer; box-shadow: 0 4px 10px rgba(230,168,0,0.35); transition: transform .2s, filter .2s;
  }
  .btn-activar:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .hueco-candado { width: 15px; height: 15px; fill: var(--lila); vertical-align: -2px; margin-right: 6px; }
  .hueco-nombre-linea { text-wrap: balance; }
  .hueco-precio { font-size: 15px; font-weight: 700; color: var(--oro); margin-top: -6px; font-variant-numeric: tabular-nums; }

  .recien { animation: brilla 2.2s ease-out 1; }
  @keyframes brilla { 0% { box-shadow: 0 0 0 0 rgba(244,212,124,.9); } 60% { box-shadow: 0 0 0 14px rgba(244,212,124,0); } 100% { box-shadow: 0 12px 26px rgba(10,2,24,.55); } }

  .coleccion-vacia {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 24px; border-radius: 16px;
    border: 1.5px dashed rgba(244,212,124,0.45);
    background: rgba(29, 8, 56, 0.45);
  }
  .coleccion-vacia .hueco { width: 96px; aspect-ratio: 2/3; border-radius: 10px; border: 1.5px dashed rgba(205,176,255,0.6); display: grid; place-items: center; flex: 0 0 auto; }
  .coleccion-vacia .hueco svg { width: 30px; height: 30px; fill: var(--lila); }
  .coleccion-vacia .texto { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .coleccion-vacia p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--texto-suave); max-width: 60ch; }
  .coleccion-vacia strong { color: var(--texto); }
  .pista-prueba { font-size: 14px !important; color: var(--lila) !important; }
  .pista-prueba code { background: rgba(244,212,124,0.15); color: var(--oro); padding: 2px 7px; border-radius: 6px; font-weight: 700; }

  .pie { text-align: center; color: var(--texto-suave); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pie img { height: 34px; width: auto; opacity: .85; }

  /* ================= LECTURA (ORÁCULO ABIERTO) ================= */
  .lectura {
    min-height: 100vh; background: var(--morado-hondo);
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    padding-block: 0 24px;
  }
  .lectura-barra {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    max-width: 1200px; margin: 0 auto; padding: 12px 0;
    background: var(--morado-hondo);
  }
  .btn-volver {
    background: rgba(255,255,255,0.08); color: var(--oro); border: 1px solid rgba(244,212,124,0.4);
    padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s;
  }
  .btn-volver:hover { background: var(--oro); color: var(--morado-hondo); }
  .lectura-nombre { font-family: var(--f-lirica); font-size: 24px; font-weight: 600; color: var(--texto); }
  .btn-offline {
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    background: rgba(255,255,255,0.08); color: var(--texto); border: 1px solid rgba(205,176,255,0.5);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: .03em;
  }
  .btn-offline svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-offline:hover { border-color: var(--lila); background: rgba(205,176,255,0.15); }
  .btn-offline.listo { color: var(--verde); border-color: rgba(159,227,184,0.5); cursor: default; }
  .lectura-derecha { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .ventana .campo { display: flex; flex-direction: column; gap: 6px; }
  .ventana input.correo { text-transform: none; letter-spacing: 0; }
  .estado-acceso { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; }
  .estado-completo { background: rgba(20,60,40,.8); color: var(--verde); }
  .estado-muestra { background: rgba(205,176,255,.15); color: var(--lila); }

  /* --- Mesa del oráculo (código de Atman) --- */
  .oracle-container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 82vh; background-color: #12061c; background-size: cover; background-position: center; background-repeat: no-repeat; color: #f4eefa; padding: 20px 12px 90px; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); overflow: hidden; user-select: none; -webkit-user-select: none; max-width: 1200px; margin: 0 auto; }
  .logo-footer { position: absolute; bottom: 24px; left: 24px; width: 130px; height: auto; opacity: 0.75; pointer-events: none; }
  .oracle-instruction { font-size: 21px; font-weight: 800; color: #fcf6ba; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); transition: opacity 0.5s ease; }
  .oracle-layout { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 950px; gap: 20px; }
  .carousel-window { width: 100%; max-width: 500px; height: 480px; overflow: hidden; position: relative; touch-action: pan-y; }
  .carousel-track { display: flex; position: absolute; left: 0; top: 30px; will-change: transform; }
  .card-wrapper { width: 260px; height: 390px; margin: 0 20px; flex-shrink: 0; transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
  .card-wrapper.active-card { perspective: 1000px; }
  .card-3d { width: 100%; height: 100%; position: relative; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .card-wrapper.active-card .card-3d { transform-style: preserve-3d; }
  .card-3d.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; border-radius: 16px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7); border: 2px solid rgba(212, 175, 55, 0.4); overflow: hidden; background-color: #0d0818; }
  .card-wrapper.active-card .card-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-wrapper.active-card .card-front { transform: rotateY(180deg); }
  .card-wrapper:not(.active-card) .card-front { display: none; }
  .oracle-container.revealed .card-wrapper:not(.active-card) { opacity: 0; transform: scale(0.8); pointer-events: none; }
  .oracle-container.revealed .card-wrapper.active-card { transform: scale(1.12); }
  .oracle-text-panel { width: 100%; max-width: 460px; padding: 26px; border-radius: 14px; background-color: rgba(13, 8, 24, 0.95); border: 1px solid rgba(252, 246, 186, 0.35); opacity: 0; transform: translateY(20px); transition: opacity 0.7s ease, transform 0.7s ease; text-align: center; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .oracle-text-panel.visible { opacity: 1; transform: translateY(0); }
  .oracle-title { font-size: 19px; color: #fcf6ba; margin-bottom: 14px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; text-wrap: balance; }
  .oracle-description { font-size: 16px; color: #e6def2; line-height: 1.7; margin-bottom: 22px; text-align: left; }
  .audio-player { display: flex; align-items: center; gap: 14px; }
  .audio-btn { flex-shrink: 0; width: 54px; height: 54px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #ffd94d 0%, #fff6b0 30%, #ffcb1f 60%, #e6a800 100%); box-shadow: 0 4px 16px rgba(255, 200, 0, 0.55), 0 0 0 3px rgba(255, 217, 77, 0.2); transition: transform 0.15s ease; padding: 0; }
  .audio-btn svg { width: 20px; height: 20px; fill: #1a1206; }
  .audio-btn .icon-play { margin-left: 3px; }
  .audio-btn:hover { transform: scale(1.08); }
  .audio-progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .audio-progress { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; margin: 0; }
  .audio-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #ffd94d; box-shadow: 0 1px 4px rgba(0,0,0,0.6); cursor: pointer; }
  .audio-time { font-size: 13px; color: #f4eefa; text-align: left; opacity: 0.85; font-variant-numeric: tabular-nums; }
  .aviso-muestra { margin-top: 14px; font-size: 14px; color: var(--lila); }
  .oracle-btn { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%); color: #0b0713; border: none; padding: 16px 42px; font-size: 18px; font-weight: 800; border-radius: 30px; cursor: pointer; letter-spacing: 1.5px; box-shadow: 0 6px 20px rgba(170, 119, 28, 0.4); transition: all 0.3s ease; text-transform: uppercase; margin-top: 22px; position: relative; z-index: 5; }
  .oracle-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
  @media (min-width: 768px) {
    .oracle-layout { flex-direction: row; gap: 15px; }
    .oracle-text-panel { transform: translateX(15px); }
    .oracle-text-panel.visible { transform: translateX(0); }
  }

  /* ================= VENTANAS (MODAL) ================= */
  .velo {
    position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(18, 5, 34, 0.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .ventana {
    width: 100%; max-width: 440px; border-radius: 18px; padding: 28px 26px;
    background: linear-gradient(170deg, #45197a 0%, var(--morado-hondo) 100%);
    border: 1px solid rgba(244,212,124,0.45); box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
    animation: sube .35s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes sube { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .ventana h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--oro); text-wrap: balance; }
  .ventana p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--texto-suave); }
  .ventana label { font-size: 14px; font-weight: 700; color: var(--texto); text-align: left; }
  .ventana input {
    width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 12px; font-size: 17px; font-weight: 600; letter-spacing: .06em;
    border: 1.5px solid rgba(244,212,124,0.5); background: rgba(255,255,255,0.96); color: #24103d; font-family: inherit; text-transform: uppercase;
  }
  .ventana input::placeholder { color: #8a7aa3; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .ventana .acciones { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .ventana .btn-licencia { justify-content: center; padding: 14px 18px; font-size: 15px; }
  .btn-secundario { background: transparent; color: var(--texto-suave); border: 1px solid rgba(205,176,255,0.45); border-radius: 999px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; }
  .btn-secundario:hover { color: var(--texto); border-color: var(--lila); }
  .btn-comprar { background: #ead7ff; color: #3a0f6b; border: none; border-radius: 999px; padding: 14px 18px; font-size: 15px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; justify-content: center; }
  .btn-comprar:hover { filter: brightness(1.05); }
  .mensaje { font-size: 15px; font-weight: 600; min-height: 1.2em; }
  .mensaje.error { color: #ffb4c4; }
  .mensaje.ok { color: var(--verde); }

  .aviso-flotante {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    z-index: 1100; background: var(--oro); color: #2a1405; font-weight: 800; font-size: 15px;
    padding: 12px 20px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: calc(100% - 32px); text-align: center;
  }

  @media (max-width: 600px) {
    .flecha { display: none; }
    .oracle-instruction { font-size: 17px; }
    .logo-footer { width: 100px; bottom: 18px; left: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<script>
/* =====================================================================
   CONFIGURACIÓN — lo único que tendrás que tocar al añadir oráculos
   ===================================================================== */

// Mientras pruebas: acepta licencias de prueba sin servidor, con el formato
// PRUEBA-<oráculo> (PRUEBA-RUMI, PRUEBA-ZEN, PRUEBA-KABBALAH…).
// Ponlo en false cuando conectes Payhip de verdad.
const MODO_PRUEBA = true;

// Dirección de la función que comprueba las licencias con Payhip (Cloudflare Pages).
const API_LICENCIAS = '/api/activar';

// Límites de la versión capada (lo que ve quien aún no ha comprado)
const MUESTRA_CARTAS = 3;        // cartas que puede sacar
const MUESTRA_AUDIO_SEG = 20;    // segundos de audio por carta

// Precio que se muestra en los huecos de "Tu colección" (cada oráculo puede tener su propio precio: precio: '5,99 €')
const PRECIO_ORACULO = '4,99 €';

const CARTAS_ATMAN = [
    { title: "SOY EL ARQUITECTO DE MI REALIDAD", audio: "01.mp3", img: "01.webp", desc: "Cada pensamiento, cada palabra y cada decisión son un ladrillo con el que construyes tu vida. Hoy recuerda que no estás a merced de las circunstancias: dentro de ti existe la sabiduría y la fuerza para crear un camino lleno de propósito. Confía en tu capacidad para elegir el amor, la paz y la luz en cada paso.<br><br>Durante el día, vuelve a esta afirmación siempre que la recuerdes. Repítela con calma y deja que sus palabras echen raíces en tu corazón. Poco a poco, tu forma de mirar la vida comenzará a reflejar la verdad que has elegido vivir." },
    { title: "CREO MI REALIDAD Y MI REALIDAD ES EL AMOR", audio: "02.mp3", img: "02.webp", desc: "El amor es una fuerza creadora que transforma todo lo que toca. Cuando eliges mirar con el corazón, tu mundo comienza a reflejar esa misma belleza. Permite que cada encuentro, cada palabra y cada acción nazcan del amor, y descubrirás que la vida siempre responde en el mismo lenguaje.<br><br>Durante el día, vuelve a esta afirmación siempre que la recuerdes. Repítela con calma y deja que sus palabras echen raíces en tu corazón. Poco a poco, tu forma de mirar la vida comenzará a reflejar la verdad que has elegido vivir." },
    { title: "RESPIRO, SUELTO Y CONFÍO", audio: "03.mp3", img: "03.webp", desc: "No necesitas cargar con aquello que ya cumplió su propósito. Con cada respiración puedes liberar el peso del miedo, la duda y el control. Confía en que la vida sostiene tus pasos incluso cuando aún no puedes ver el camino completo. Hoy regálate la paz de dejar que todo florezca a su debido tiempo.<br><br>Durante el día, vuelve a esta afirmación siempre que la recuerdes. Repítela con calma y deja que sus palabras echen raíces en tu corazón. Poco a poco, tu forma de mirar la vida comenzará a reflejar la verdad que has elegido vivir." },
    { title: "MI POTENCIAL ES ILIMITADO", audio: "04.mp3", img: "04.webp", desc: "Dentro de ti habita una fuente infinita de creatividad, amor y sabiduría que espera ser expresada. No permitas que las dudas definan quién eres. Cada día es una nueva oportunidad para descubrir una versión más luminosa de ti mismo. Avanza con confianza, porque el mayor límite desaparece cuando recuerdas tu verdadera esencia.<br><br>Durante el día, vuelve a esta afirmación siempre que la recuerdes. Repítela con calma y deja que sus palabras echen raíces en tu corazón. Poco a poco, tu forma de mirar la vida comenzará a reflejar la verdad que has elegido vivir." },
    { title: "CADA DÍA ES UNA NUEVA OPORTUNIDAD DE APERTURA Y PROGRESO", audio: "05.mp3", img: "05.webp", desc: "El amanecer de hoy no es solo un cambio en el reloj, sino un lienzo en blanco para tu mente y tu espíritu. Al abrirte a lo nuevo, permites que la vida te sorprenda con aprendizajes y caminos que antes no podías ver. El progreso no siempre es un gran salto; a veces es la sutil disposición a dar un paso más con el corazón abierto.<br><br>Lleva este pensamiento contigo a lo largo de las horas. Mantenlo presente en tus pausas cotidianas y nota cómo, al abrir tu mente, tu entorno responde con nuevas y mejores perspectivas." },
    { title: "TODO LO QUE SUCEDE ES PARA MI EVOLUCIÓN", audio: "06.mp3", img: "06.webp", desc: "Incluso las tormentas y los desvíos inesperados tienen un propósito en tu historia. La vida no conspira en tu contra, sino que te moldea para que despiertes tu verdadera fortaleza. Mira cada situación, ya sea cómoda o desafiante, como una maestra silenciosa que te invita a crecer. Cuando dejas de resistirte, transformas los obstáculos en peldaños hacia tu madurez espiritual.<br><br>Respira hondo y recuerda estas palabras ante cualquier imprevisto de hoy. Al abrazar la experiencia sin juzgarla, verás cómo el caos se transforma en sabiduría." },
    { title: "SUSTITUYO LA QUEJA POR LA GRATITUD", audio: "07.mp3", img: "07.webp", desc: "La queja nubla tu mirada y te encadena a lo que te falta, mientras que la gratitud enciende una luz sobre toda la abundancia que ya te rodea. Al cambiar el foco de atención, transformas tu energía interior y sintonizas con la belleza de las pequeñas cosas. Agradecer no significa ignorar las dificultades, sino elegir valorar la vida por encima de ellas, abriendo la puerta a más bendiciones.<br><br>Haz de esta idea tu brújula para las próximas horas. Cada vez que sientas el impulso de protestar, busca un motivo para dar las gracias y observa cómo cambia tu vibración." },
    { title: "ELIJO SER LA PAZ QUE BUSCO EN EL MUNDO", audio: "08.mp3", img: "08.webp", desc: "La serenidad no se encuentra allá afuera, ni depende de que el entorno sea perfecto; es un refugio que construyes dentro de ti. Cuando decides calmar tu propia tormenta mental, te conviertes en un faro de tranquilidad para los demás. Tu paz interior es un regalo que te haces a ti mismo y, a la vez, tu mayor contribución para sanar el mundo que te rodea.<br><br>Regresa a este centro de calma siempre que el ruido exterior intente arrastrarte. Repítelo en silencio y permite que tu propia quietud guíe tus acciones de hoy." },
    { title: "NO CONTROLO LO QUE PASA, PERO SÍ CÓMO RESPONDO A ELLO", audio: "09.mp3", img: "09.webp", desc: "El exterior es impredecible y a menudo caótico, pero tu mundo interno te pertenece por completo. Tu verdadero poder no radica en cambiar los acontecimientos, sino en la pausa consciente que tomas antes de reaccionar. Al elegir la madurez, la compasión y la templanza en tus respuestas, dejas de ser una víctima de las circunstancias para convertirte en el dueño de tu propio destino.<br><br>Usa esta afirmación como un escudo mental. Antes de reaccionar en piloto automático, tómate un segundo para elegir la respuesta que mejor refleje tu sabiduría." },
    { title: "MIRO MIS PENSAMIENTOS PASAR, NO ME APEGO A NINGUNO", audio: "10.mp3", img: "10.webp", desc: "Tú no eres la tormenta de tu mente, sino el cielo inmenso que la observa. Los pensamientos van y vienen como nubes en el viento; no necesitas retenerlos, juzgarlos ni luchar contra ellos. Al mirarlos pasar desde la distancia del observador, recuperas tu libertad. En ese espacio de desapego y silencio, descubres la quietud inalterable de tu ser.<br><br>Convierte este texto en tu cable a tierra. Cada vez que tu mente se sature, visualiza tus ideas marchándose en calma y recupera el control de tu presente." },
    { title: "VIVO PLENAMENTE EN EL PRESENTE; EL PASADO YA CUMPLIÓ SU FUNCIÓN", audio: "11.mp3", img: "11.webp", desc: "Cada instante es una nueva oportunidad para comenzar de nuevo. El pasado te ofreció experiencias, aprendizajes y crecimiento, pero ya no necesita definir quién eres hoy. Cuando sueltas el peso de lo que fue, descubres la inmensa libertad de habitar este momento, el único lugar donde realmente existe la vida.<br><br>Convierte esta frase en tu refugio diario. Siempre que tu mente viaje hacia lo que ya pasó, regresa con suavidad al presente y recuerda que aquí es donde nace tu verdadero poder." },
    { title: "ESTOY AQUÍ PARA EXPRESAR MIS DONES AL MUNDO", audio: "12.mp3", img: "12.webp", desc: "Dentro de ti existen talentos, cualidades y una luz única que nadie más puede ofrecer de la misma manera. No viniste a compararte ni a imitar a otros, sino a compartir aquello que solo tú puedes entregar. Cuando expresas tu esencia con autenticidad, enriqueces tu vida y también la de quienes te rodean.<br><br>Haz de esta afirmación tu guía. Antes de comenzar el día, recuerda que cada pequeño gesto inspirado desde el corazón ya está transformando el mundo." },
    { title: "CADA PUERTA QUE SE CIERRA ME ACERCA HACIA MI VERDADERO DESTINO", audio: "13.mp3", img: "13.webp", desc: "Lo que parece una pérdida muchas veces es una redirección. La vida elimina caminos que ya no corresponden con tu crecimiento para abrir otros más alineados con quien estás destinado a ser. Aunque hoy no comprendas el motivo, cada final prepara un nuevo comienzo.<br><br>Cuando algo no salga como esperabas, repite esta frase con confianza. Permite que la incertidumbre se transforme en la certeza de que la vida siempre trabaja a tu favor." },
    { title: "MI RETO DE HOY ES SUPERAR MI VERSIÓN DE AYER", audio: "14.mp3", img: "14.webp", desc: "La verdadera competencia nunca está fuera de ti. Cada día es una oportunidad para dar un pequeño paso más, aprender algo nuevo o actuar con un poco más de amor, paciencia y valentía. El crecimiento constante convierte los pequeños avances en grandes transformaciones.<br><br>Haz de esta frase tu inspiración diaria. No busques ser perfecto; busca ser un poco mejor que ayer, y el futuro cambiará por sí solo." },
    { title: "EL MIEDO ME MUESTRA DÓNDE ESTÁ MI SIGUIENTE NIVEL DE SUPERACIÓN", audio: "15.mp3", img: "15.webp", desc: "El miedo no siempre aparece para detenerte; muchas veces señala el lugar exacto donde comienza tu expansión. Detrás de aquello que hoy te intimida suelen encontrarse las experiencias que más fortalecerán tu confianza y tu libertad. Cada paso que das a pesar del miedo amplía los límites de tu vida.<br><br>Cada vez que sientas temor, respira profundamente y recuerda que, al otro lado de ese desafío, puede estar la mejor versión de ti." },
    { title: "NO CAIGO, SOLO GANO IMPULSO PARA VOLVER A LEVANTARME", audio: "16.mp3", img: "16.webp", desc: "Los tropiezos no son el final del camino, sino parte natural del aprendizaje. Cada dificultad fortalece tu carácter, amplía tu experiencia y despierta recursos que quizás aún no conocías. Lo importante no es evitar las caídas, sino descubrir la fuerza que nace al levantarte una vez más.<br><br>Cuando enfrentes un fracaso, recuerda esta frase. Permite que cada obstáculo se convierta en el impulso que te acerque aún más a tus sueños." },
    { title: "BENDIGO EL PROCESO, AUNQUE HOY NO ENTIENDA EL DESTINO", audio: "17.mp3", img: "17.webp", desc: "No todo necesita ser comprendido de inmediato. Hay etapas cuyo sentido solo se revela con el paso del tiempo. Confiar en el proceso es reconocer que la vida posee una sabiduría más amplia que nuestra visión del momento presente.<br><br>Cuando aparezca la incertidumbre, entrega el control y agradece el camino. La confianza abre puertas que la preocupación nunca podrá abrir." },
    { title: "SOY MÁS FUERTE QUE LAS CIRCUNSTANCIAS QUE ME RODEAN", audio: "18.mp3", img: "18.webp", desc: "Las circunstancias cambian constantemente, pero tu fortaleza interior permanece. No eres definido por los problemas que enfrentas, sino por la actitud con la que decides responder a ellos. En tu interior existe una fuerza mucho mayor que cualquier desafío externo.<br><br>Haz de esta frase un ancla en los momentos difíciles. Recuerda que ninguna tormenta puede apagar la luz de quien ha descubierto su fortaleza interior." },
    { title: "LA APERTURA Y LA SENSIBILIDAD SON MI MAYOR FORTALEZA, NO UNA DEBILIDAD", audio: "19.mp3", img: "19.webp", desc: "Abrir el corazón requiere mucho más valor que levantar muros. La sensibilidad te permite comprender, amar y conectar profundamente con la vida y con los demás. Aquello que algunos consideran fragilidad puede convertirse en tu mayor fuente de sabiduría y compasión.<br><br>Siempre que dudes de tu sensibilidad, recuerda que un corazón abierto tiene la capacidad de transformar mucho más que uno protegido por el miedo." },
    { title: "ME DOY A MÍ MISMO EL AMOR, RESPETO Y ATENCIÓN QUE MEREZCO", audio: "20.mp3", img: "20.webp", desc: "La relación más importante de tu vida es la que construyes contigo mismo. Cuando te cuidas, te escuchas y te tratas con amabilidad, todo lo demás comienza a ordenarse de forma natural. El amor propio no es egoísmo, sino la base desde la cual puedes compartir lo mejor de ti.<br><br>Convierte esta frase en un compromiso diario. Dedícate el mismo cariño, paciencia y comprensión que ofrecerías a alguien que amas profundamente." },
    { title: "ATRAIGO RELACIONES QUE REFLEJAN EL AMOR Y LA PAZ QUE BUSCO DENTRO", audio: "21.mp3", img: "21.webp", desc: "Las relaciones son un reflejo del estado interior desde el que vivimos. Cuando cultivas amor, respeto y serenidad en tu propio corazón, comienzas a conectar con personas que vibran en esa misma frecuencia. Lo que construyes dentro termina manifestándose fuera.<br><br>Cada día fortalece primero tu paz interior. Desde ese lugar, permitirás que lleguen personas que sumen luz a tu camino." },
    { title: "SUELTO LA NECESIDAD DE COMPLACER A OTROS PARA SINTONIZAR CONMIGO", audio: "22.mp3", img: "22.webp", desc: "No naciste para cumplir las expectativas de los demás, sino para vivir en coherencia con tu verdad. Buscar aprobación constante te aleja de tu esencia, mientras que escucharte con honestidad te devuelve la paz. Tu autenticidad siempre será más valiosa que cualquier aceptación externa.<br><br>Cada vez que dudes entre agradar o ser fiel a ti mismo, elige tu verdad. Allí comienza la verdadera libertad." },
    { title: "ACEPTO A LOS DEMÁS TAL COMO SON Y ME LIBERO DE LA CARGA DE CAMBIARLOS", audio: "23.mp3", img: "23.webp", desc: "Cada persona recorre un camino diferente y aprende a su propio ritmo. Cuando dejas de intentar controlar o transformar a los demás, recuperas una enorme cantidad de energía para dedicarla a tu propio crecimiento. La aceptación trae paz donde la resistencia solo genera sufrimiento.<br><br>Cuando alguien actúe de forma distinta a tus expectativas, recuerda esta frase y permite que el respeto sustituya al juicio." },
    { title: "MI VALOR NO DEPENDE DE LA VALIDACIÓN DE NADIE, SOLO DE DAR LO MEJOR DE MÍ MISMO", audio: "24.mp3", img: "24.webp", desc: "Tu valor no aumenta con los elogios ni disminuye con las críticas. Eres valioso por quien eres, no por la opinión de los demás. Cuando haces las cosas con honestidad y entregas lo mejor de ti, puedes caminar con serenidad sin depender del reconocimiento externo.<br><br>Haz de esta afirmación tu recordatorio diario. Que tu mayor satisfacción sea actuar en coherencia con tus propios valores." },
    { title: "MI CUERPO ES UN TEMPLO SAGRADO; LO CUIDO, LO ESCUCHO Y LO RESPETO", audio: "25.mp3", img: "25.webp", desc: "Tu cuerpo es el hogar desde el que experimentas la vida. Cada respiración, cada latido y cada movimiento sostienen silenciosamente tu existencia. Tratarlo con respeto, descanso y gratitud es una forma de honrar el milagro de estar vivo.<br><br>Dedica unos instantes cada día a escuchar lo que tu cuerpo necesita. Agradecerlo y cuidarlo es también una forma de cuidar tu alma." },
    { title: "CADA CÉLULA DE MI CUERPO VIBRA EN SALUD, ENERGÍA Y VITALIDAD", audio: "26.mp3", img: "26.webp", desc: "Tu mente y tu cuerpo mantienen un diálogo constante. Los pensamientos de bienestar, esperanza y confianza fortalecen tu actitud hacia la vida y favorecen un estado de mayor equilibrio. Cuando eliges enfocarte en la salud, despiertas una energía renovadora que impregna todo tu ser.<br><br>Repite esta frase con calma mientras respiras profundamente. Imagina cómo cada célula se llena de luz, fuerza y vitalidad." },
    { title: "MI FELICIDAD NACE DE MI FORMA DE MIRAR LA VIDA", audio: "27.mp3", img: "27.webp", desc: "La felicidad no siempre depende de lo que ocurre, sino de la manera en que eliges contemplarlo. Una misma realidad puede vivirse desde la queja o desde el agradecimiento, desde el miedo o desde la confianza. Cuando transformas tu mirada, el mundo comienza a transformarse contigo.<br><br>Haz de esta afirmación un recordatorio diario. Busca la belleza en los pequeños instantes y descubrirás que la alegría siempre encuentra un camino hacia ti." },

const CLAVE_PUBLICA = {"kty":"EC","x":"NIS7U2dS4ZAkfwNLp7k44M0Jp89iuqCvBhJMz8PwloA","y":"eu_jFM5JIesnfLoMGzEteV-JKVW5ZOrNgfBhi4qyvag","crv":"P-256"};

/* Almacenamiento triple y redundante: localStorage + cookie + IndexedDB.
   iOS a veces borra uno de ellos; si queda alguno, se recupera y se vuelve a copiar en
   los demás (se "autocura"). Además el servidor guarda una copia (cookie HttpOnly). */
const Store = (function () {
  const IDB = 'od_store', TABLA = 'kv', UN_ANO = 60 * 60 * 24 * 365;
  function conTiempo(promesa, ms, porDefecto) {
    return new Promise(res => {
      let hecho = false;
      const t = setTimeout(() => { if (!hecho) { hecho = true; res(porDefecto); } }, ms);
      promesa.then(v => { if (!hecho) { hecho = true; clearTimeout(t); res(v); } },
                   () => { if (!hecho) { hecho = true; clearTimeout(t); res(porDefecto); } });
    });
  }
  function idbAbrir() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(IDB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(TABLA);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  const idbGet = k => conTiempo(idbAbrir().then(db => new Promise(res => {
    try { const r = db.transaction(TABLA, 'readonly').objectStore(TABLA).get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }
    catch (e) { res(null); }
  })), 1500, null);
  const idbSet = (k, v) => conTiempo(idbAbrir().then(db => new Promise(res => {
    try { const tx = db.transaction(TABLA, 'readwrite'); tx.objectStore(TABLA).put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }
    catch (e) { res(false); }
  })), 1500, false);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const ckGet = k => {
    try { const m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; }
    catch (e) { return null; }
  };
  const ckSet = (k, v) => {
    try { document.cookie = k + '=' + encodeURIComponent(v) + '; max-age=' + UN_ANO + '; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : ''); }
    catch (e) {}
  };
  function set(k, v) { lsSet(k, v); ckSet(k, v); return idbSet(k, v); }
  // Devuelve lo que haya en los tres sitios (para poder juntarlo)
  async function todos(k) { return [lsGet(k), ckGet(k), await idbGet(k)].filter(Boolean); }
  async function get(k) {
    const v = lsGet(k) || ckGet(k) || await idbGet(k);
    if (v) set(k, v);
    return v;
  }
  return { get, set, todos };
})();

// Junta lo encontrado en los tres sitios sin perder nada (prefiere lo firmado y lo más reciente)
function juntar(...listas) {
  const r = {};
  for (const l of listas) for (const [id, e] of Object.entries(l || {})) {
    if (!e || !e.l) continue;
    const ya = r[id];
    const mejor = !ya || (!ya.f && e.f) || ((e.c || 0) > (ya.c || 0) && (e.f || !ya.f));
    if (mejor) r[id] = Object.assign({}, e, { d: Math.min(e.d || Date.now(), (ya && ya.d) || Infinity) });
  }
  return r;
}

function b64urlABytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s); const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
let clavePub = null;
async function firmaValida(id, e) {
  if (e.p) return MODO_PRUEBA;
  if (!e.f || !window.crypto || !crypto.subtle) return false;
  try {
    clavePub = clavePub || await crypto.subtle.importKey('jwk', CLAVE_PUBLICA, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, clavePub, b64urlABytes(e.f),
      new TextEncoder().encode('od1|' + id + '|' + e.l + '|' + dispositivo));
  } catch (err) { return false; }
}

/* Arrastre con ratón (en táctil el desplazamiento es nativo, con inercia) */
function activarArrastre(fila) {
  let abajo = false, x0 = 0, s0 = 0, movido = false;
  fila.addEventListener('mousedown', e => { abajo = true; movido = false; x0 = e.clientX; s0 = fila.scrollLeft; });
  window.addEventListener('mousemove', e => {
    if (!abajo) return;
    const d = e.clientX - x0;
    if (Math.abs(d) > 5) { movido = true; fila.classList.add('arrastrando'); }
    fila.scrollLeft = s0 - d;
  });
  window.addEventListener('mouseup', () => { if (!abajo) return; abajo = false; fila.classList.remove('arrastrando'); });
  fila.addEventListener('click', e => { if (movido) { e.stopPropagation(); e.preventDefault(); movido = false; } }, true);
  fila.addEventListener('scroll', actualizarFlechas, { passive: true });
}
function actualizarFlechas() {
  document.querySelectorAll('.flecha').forEach(b => {
    const f = document.getElementById(b.dataset.fila);
    if (!f) return;
    const max = f.scrollWidth - f.clientWidth - 2;
    b.disabled = b.dataset.dir === '-1' ? f.scrollLeft <= 2 : f.scrollLeft >= max;
  });
}
document.querySelectorAll('.flecha').forEach(b => b.addEventListener('click', () => {
  const f = document.getElementById(b.dataset.fila);
  f.scrollBy({ left: Number(b.dataset.dir) * f.clientWidth * 0.8, behavior: 'smooth' });
}));

    btn.disabled = true; btn.textContent = 'Comprobando…'; msj.className = 'mensaje'; msj.textContent = '';
    const r = await activarLicencia(correo.value, campo.value, liberar);
    btn.disabled = false; btn.textContent = 'Activar';
    if (r.ok) {
      cerrarVentana();
      pintar(r.oraculo);
      avisar(`${oraculo(r.oraculo).nombre} ya está en tu colección`);
      document.getElementById('t-coleccion').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    msj.className = 'mensaje error'; msj.textContent = r.error;
    if (r.necesitaLiberar) {
      const b = document.createElement('button');
      b.type = 'button'; b.id = 'btn-liberar'; b.className = 'btn-comprar';
      b.textContent = 'Liberar el más antiguo y activar aquí';
      b.addEventListener('click', () => enviar(true));
      document.getElementById('acciones-licencia').prepend(b);
    }
  }
  document.getElementById('form-licencia').addEventListener('submit', e => { e.preventDefault(); enviar(false); });
}

/* =====================================================================
   LICENCIAS
   ===================================================================== */
async function llamarServidor(cuerpo) {
  const res = await fetch(API_LICENCIAS, {
    method: 'POST', credentials: 'same-origin', cache: 'no-store',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo)
  });
  return res.json();
}

async function activarLicencia(email, texto, liberar) {
  const licencia = (texto || '').trim().toUpperCase();
  email = (email || '').trim().toLowerCase();
  if (!licencia) return { ok: false, error: 'Pega tu licencia.' };
  if (!dispositivo) dispositivo = await obtenerDispositivo();

  if (MODO_PRUEBA && licencia.startsWith('PRUEBA-')) {
    const id = licencia.slice(7).toLowerCase();
    if (!oraculo(id)) return { ok: false, error: 'Esa licencia de prueba no corresponde a ningún oráculo.' };
    if (loTiene(id)) return { ok: false, error: `${oraculo(id).nombre} ya estaba en tu colección.` };
    coleccion[id] = { l: licencia, d: Date.now(), c: Date.now(), p: 1 };
    await guardarColeccion(); await verificarColeccion();
    return { ok: true, oraculo: id };
  }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { ok: false, error: 'Escribe el correo con el que hiciste la compra.' };

  try {
    const d = await llamarServidor({ accion: 'activar', email, licencia, dispositivo, liberar: !!liberar });
    if (d.ok && oraculo(d.oraculo)) {
      const yaEstaba = loTiene(d.oraculo);
      const previa = coleccion[d.oraculo];
      coleccion[d.oraculo] = { l: d.licencia || licencia, f: d.firma, d: (previa && previa.d) || Date.now(), c: Date.now() };
      Store.set(K_EMAIL, email);
      await guardarColeccion(); await verificarColeccion();
      pedirPersistencia();
      if (!loTiene(d.oraculo)) return { ok: false, error: 'No se pudo confirmar la licencia en este dispositivo. Inténtalo de nuevo.' };
      if (yaEstaba) return { ok: false, error: `${oraculo(d.oraculo).nombre} ya estaba en tu colección.` };
      return { ok: true, oraculo: d.oraculo };
    }
    return { ok: false, error: d.error || 'No encontramos esa licencia. Revisa que esté completa, con sus guiones.', necesitaLiberar: !!d.necesitaLiberar };
  } catch (err) {
    return { ok: false, error: 'No se pudo comprobar la licencia ahora mismo. Revisa tu conexión a internet e inténtalo de nuevo.' };
  }
}

// Último respaldo: si el móvil perdió su colección, el servidor la devuelve (cookie HttpOnly)
async function recuperarDelServidor() {
  if (!navigator.onLine) return;
  const tiempo = new Promise(res => setTimeout(() => res(null), 4000));
  const peticion = fetch('/api/sesion', { credentials: 'same-origin', cache: 'no-store' })
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const d = await Promise.race([peticion, tiempo]);
  if (!d || !d.ok || !Array.isArray(d.coleccion) || !d.coleccion.length) return;
  // Si este móvil perdió también su identificador, se recupera el del servidor
  if (d.dispositivo && d.dispositivo !== dispositivo && validas.size === 0) {
    dispositivo = d.dispositivo; Store.set(K_DISPOSITIVO, dispositivo);
  }
  if (d.dispositivo !== dispositivo) return;
  const antes = validas.size;
  for (const x of d.coleccion) {
    const e = coleccion[x.oraculo];
    coleccion[x.oraculo] = { l: x.licencia, f: x.firma, d: (e && e.d) || Date.now(), c: Date.now() };
  }
  if (d.email) Store.set(K_EMAIL, d.email);
  await guardarColeccion(); await verificarColeccion();
  if (validas.size !== antes) { pintar(); avisar('Hemos recuperado tu colección'); }
}

// Una vez por semana, en silencio, se comprueba que las licencias siguen activas
// (reembolso en Payhip o dispositivo liberado). Sin conexión no se toca nada.
async function recomprobarLicencias() {
  const SEMANA = 7 * 24 * 3600 * 1000;
  if (!navigator.onLine) return;
  let cambios = false;
  for (const [id, e] of Object.entries(coleccion)) {
    if (e.p || Date.now() - (e.c || 0) < SEMANA) continue;
    try {
      const d = await llamarServidor({ accion: 'comprobar', licencia: e.l, dispositivo });
      if (d.ok && d.oraculo === id) { e.c = Date.now(); if (d.firma) e.f = d.firma; cambios = true; }
      else if (d.desactivada) { delete coleccion[id]; cambios = true; }
    } catch (err) { /* sin conexión: se deja como está */ }
  }
  if (cambios) { await guardarColeccion(); await verificarColeccion(); pintar(); }
}

// Enlace mágico: si la app se abre con ?licencia=XXXX (y opcionalmente &email=…) se activa sola
async function licenciaDesdeEnlace() {
  let lic = null, em = '';
  try { const q = new URLSearchParams(location.search); lic = q.get('licencia'); em = q.get('email') || ''; } catch (e) {}
  if (!lic) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  const r = await activarLicencia(em || await Store.get(K_EMAIL), lic);
  if (r.ok) { pintar(r.oraculo); avisar(`${oraculo(r.oraculo).nombre} ya está en tu colección`); }
  else { abrirVentanaLicencia(r.error); document.getElementById('campo-licencia').value = lic; }
}

/* =====================================================================
   LECTURA — motor del oráculo (código de Atman, generalizado)
   ===================================================================== */
let actual = null;          // oráculo abierto
let cartas = [];            // cartas barajadas
let acceso = 'completo';    // 'completo' | 'muestra'
const sacadas = {};         // cartas sacadas en modo muestra, por oráculo

const track = document.getElementById('carouselTrack');
const windowEl = document.getElementById('carouselWindow');
const cardWidth = 300;
let totalCards = 0, currentIndex = 0, isFlipped = false, trackX = 0;
let magicSound = new Audio();

function abrirLectura(o) {
  actual = o;
  acceso = (loTiene(o.id) || o.abiertoParaTodos) ? 'completo' : 'muestra';
  sacadas[o.id] = sacadas[o.id] || 0;

  document.getElementById('lectura-nombre').textContent = `${o.nombre} · ${o.subtitulo}`;
  pintarEstadoAcceso();
  document.getElementById('oracleContainer').style.backgroundImage = `url('${o.base}${o.fondo}')`;
  magicSound = new Audio(o.base + o.sonido);

  cartas = o.cartas.slice();
  totalCards = cartas.length;
  shuffleCards(cartas);
  reiniciarMesa();

  document.getElementById('vista-catalogo').hidden = true;
  document.getElementById('vista-lectura').hidden = false;
  window.scrollTo(0, 0);
  buildCarousel();
  if (window.ODOffline) window.ODOffline.guardarCartas(o.id);   // las cartas se guardan solas
  pintarBotonOffline();
}

/* --- Guardar el oráculo entero (cartas + audios) para usarlo sin conexión --- */
const ICONO_BAJAR = '<svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 19h14"/></svg>';
let descargando = false;
async function pintarBotonOffline() {
  const b = document.getElementById('btn-offline');
  const off = window.ODOffline;
  if (!off || !actual || acceso !== 'completo') { b.hidden = true; return; }
  if (descargando) return;
  const st = await off.estado(actual.id);
  if (!st.images.total && !st.audio.total) { b.hidden = true; return; }
  b.hidden = false;
  if (st.completo) { b.className = 'btn-offline listo'; b.textContent = '✓ Disponible sin conexión'; return; }
  const mb = Math.max(1, Math.round(st.bytesFaltan / 1048576));
  b.className = 'btn-offline';
  b.innerHTML = `${ICONO_BAJAR} Guardar sin conexión · ${mb} MB`;
}
document.getElementById('btn-offline').addEventListener('click', async () => {
  const off = window.ODOffline, b = document.getElementById('btn-offline');
  if (!off || !actual || b.classList.contains('listo')) return;
  if (descargando) { off.parar(); return; }
  descargando = true;
  b.textContent = 'Guardando… 0 %';
  const r = await off.descargar(actual.id, pct => { b.textContent = `Guardando… ${pct} % · tocar para parar`; });
  descargando = false;
  if (r.sinRed) avisar('Necesitas conexión para guardarlo.');
  else if (r.sinEspacio) avisar('No hay espacio suficiente en el dispositivo.');
  else if (r.parado) avisar('Descarga detenida. Puedes seguir cuando quieras.');
  else if (r.fallos) avisar('Algunos archivos no se guardaron. Inténtalo de nuevo con conexión.');
  else avisar(`${actual.nombre} ya funciona sin conexión`);
  pintarBotonOffline();
});

function pintarEstadoAcceso() {
  const e = document.getElementById('estado-acceso');
  if (acceso === 'completo') { e.className = 'estado-acceso estado-completo'; e.textContent = 'Oráculo completo'; }
  else {
    const quedan = Math.max(0, MUESTRA_CARTAS - sacadas[actual.id]);
    e.className = 'estado-acceso estado-muestra';
    e.textContent = `Muestra · ${quedan} ${quedan === 1 ? 'carta' : 'cartas'}`;
  }
}

function reiniciarMesa() {
  audioEl.pause();
  isFlipped = false;
  document.getElementById('oracleContainer').classList.remove('revealed');
  const p = document.getElementById('textPanel'); p.classList.remove('visible'); p.hidden = true;
  document.getElementById('actionBtn').innerText = 'Consulta el oráculo';
  document.getElementById('mainInstruction').style.opacity = '1';
}

document.getElementById('btn-volver').addEventListener('click', () => {
  reiniciarMesa(); cancelAnimationFrame(rafId);
  document.getElementById('vista-lectura').hidden = true;
  document.getElementById('vista-catalogo').hidden = false;
  pintar();
});

function ventanaComprar(motivo) {
  const o = actual;
  abrirVentana(`<h3 id="ventana-titulo">Abre ${o.nombre} completo</h3>
    <p>${motivo} Con el oráculo completo tendrás todas las cartas y todos los audios, siempre que quieras.</p>
    <div class="acciones">
      <a class="btn-comprar" href="${o.payhip}" target="_blank" rel="noopener">Comprar en Payhip</a>
      <button class="btn-licencia" data-accion="licencia">Ya lo compré: activar licencia</button>
      <button class="btn-secundario" data-accion="cerrar">Seguir mirando</button>
    </div>`);
}

function shuffleCards(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
function centerOffset() { return (windowEl.offsetWidth / 2) - (cardWidth / 2); }
function positionForIndex(i) { return centerOffset() - i * cardWidth; }
function indexForPosition(x) { return (centerOffset() - x) / cardWidth; }

function buildCarousel() {
  track.innerHTML = '';
  let g = 0;
  const base = actual.base, dorso = actual.base + actual.dorso;
  for (let s = 0; s < 3; s++) {
    cartas.forEach((c, idx) => {
      const w = document.createElement('div');
      w.className = 'card-wrapper';
      w.id = `wrapper-${g}`;
      w.setAttribute('data-original-index', idx);
      w.innerHTML = `<div class="card-3d" id="card-${g}"><div class="card-face card-back"><img src="${dorso}" draggable="false" alt=""></div><div class="card-face card-front"><img src="${base}${c.img}" draggable="false" alt=""></div></div>`;
      track.appendChild(w);
      g++;
    });
  }
  currentIndex = totalCards + Math.floor(Math.random() * totalCards);
  trackX = positionForIndex(currentIndex);
  const act = document.getElementById(`wrapper-${currentIndex}`);
  if (act) act.classList.add('active-card');
  applyTrackPosition(false);
}

function applyTrackPosition(animate) {
  track.style.transition = animate ? 'transform 0.4s cubic-bezier(0.215, 0.610, 0.355, 1)' : 'none';
  track.style.transform = `translateX(${trackX}px)`;
  const idx = Math.round(indexForPosition(trackX));
  if (idx !== currentIndex) {
    currentIndex = idx;
    document.querySelectorAll('.card-wrapper.active-card').forEach(w => w.classList.remove('active-card'));
    const act = document.getElementById(`wrapper-${currentIndex}`);
    if (act) act.classList.add('active-card');
  }
}
function updateTrackPosition(anim = true) { trackX = positionForIndex(currentIndex); applyTrackPosition(anim); }
function wrapIfNeeded() {
  const idxFloat = indexForPosition(trackX);
  const period = totalCards * cardWidth;
  if (idxFloat < totalCards * 0.5) trackX -= period;
  else if (idxFloat > totalCards * 2.5) trackX += period;
}

/* --- Audio --- */
const audioEl = new Audio();
const progressEl = document.getElementById('audioProgress');
const timeEl = document.getElementById('audioTime');
let isSeeking = false;
const limiteAudio = () => (acceso === 'muestra' && audioEl.duration > MUESTRA_AUDIO_SEG) ? MUESTRA_AUDIO_SEG : audioEl.duration;

function formatTime(sec) {
  if (!isFinite(sec) || isNaN(sec) || sec < 0) return '0:00';
  return `${Math.floor(sec / 60)}:${Math.floor(sec % 60).toString().padStart(2, '0')}`;
}
function paintProgress(pct) { progressEl.style.background = `linear-gradient(to right, #ffd94d ${pct}%, rgba(255,255,255,0.2) ${pct}%)`; }
function showPlayIcon() { document.getElementById('iconPlay').style.display = 'block'; document.getElementById('iconPause').style.display = 'none'; }
function showPauseIcon() { document.getElementById('iconPlay').style.display = 'none'; document.getElementById('iconPause').style.display = 'block'; }

audioEl.addEventListener('loadedmetadata', () => { progressEl.max = limiteAudio() || 100; timeEl.textContent = `0:00 / ${formatTime(limiteAudio())}`; });
audioEl.addEventListener('timeupdate', () => {
  if (isSeeking) return;
  if (acceso === 'muestra' && audioEl.currentTime >= MUESTRA_AUDIO_SEG) {
    audioEl.pause(); audioEl.currentTime = 0; showPlayIcon(); paintProgress(0);
    ventanaComprar(`Has escuchado los primeros ${MUESTRA_AUDIO_SEG} segundos de este audio.`);
    return;
  }
  const lim = limiteAudio();
  progressEl.value = audioEl.currentTime;
  paintProgress(lim ? (audioEl.currentTime / lim) * 100 : 0);
  timeEl.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(lim)}`;
});
audioEl.addEventListener('ended', () => { showPlayIcon(); progressEl.value = 0; paintProgress(0); });
progressEl.addEventListener('input', () => {
  isSeeking = true;
  const lim = limiteAudio();
  paintProgress(lim ? (progressEl.value / lim) * 100 : 0);
  timeEl.textContent = `${formatTime(progressEl.value)} / ${formatTime(lim)}`;
});
progressEl.addEventListener('change', () => { if (audioEl.src) audioEl.currentTime = progressEl.value; isSeeking = false; });

function setupAudioButton(cardData) {
  audioEl.pause(); audioEl.src = actual.base + cardData.audio;
  showPlayIcon(); progressEl.value = 0; progressEl.max = 100; paintProgress(0); timeEl.textContent = '0:00 / 0:00';
}
document.getElementById('audioBtn').addEventListener('click', () => {
  if (!audioEl.src) return;
  if (audioEl.paused) { audioEl.play().catch(() => {}); showPauseIcon(); } else { audioEl.pause(); showPlayIcon(); }
});

/* --- Consultar --- */
document.getElementById('actionBtn').addEventListener('click', consultOracle);
function consultOracle() {
  const container = document.getElementById('oracleContainer');
  const btn = document.getElementById('actionBtn');
  const textPanel = document.getElementById('textPanel');
  const activeCard = document.getElementById(`card-${currentIndex}`);

  if (isFlipped) {
    audioEl.pause();
    textPanel.classList.remove('visible');
    setTimeout(() => { textPanel.hidden = true; activeCard.classList.remove('flipped'); container.classList.remove('revealed'); document.getElementById('mainInstruction').style.opacity = '1'; updateTrackPosition(true); }, 200);
    btn.innerText = 'Consulta el oráculo';
    isFlipped = false;
    return;
  }

  if (acceso === 'muestra' && sacadas[actual.id] >= MUESTRA_CARTAS) {
    ventanaComprar(`Ya has sacado las ${MUESTRA_CARTAS} cartas de muestra.`);
    return;
  }

  if (activeCard) {
    magicSound.currentTime = 0;
    magicSound.play().catch(() => {});
    const originalIndex = document.getElementById(`wrapper-${currentIndex}`).getAttribute('data-original-index');
    const cardData = cartas[originalIndex];
    if (acceso === 'muestra') { sacadas[actual.id]++; pintarEstadoAcceso(); }
    document.getElementById('cardTitle').innerHTML = cardData.title;
    document.getElementById('cardDesc').innerHTML = cardData.desc;
    const aviso = document.getElementById('avisoMuestra');
    aviso.hidden = acceso !== 'muestra';
    aviso.textContent = `En la muestra, el audio se escucha ${MUESTRA_AUDIO_SEG} segundos.`;
    setupAudioButton(cardData);
    container.classList.add('revealed');
    activeCard.classList.add('flipped');
    isFlipped = true;
    btn.innerText = 'Elegir otra carta';
    document.getElementById('mainInstruction').style.opacity = '0';
    textPanel.hidden = false;
    setTimeout(() => textPanel.classList.add('visible'), 300);
  }
}

/* --- Arrastre e inercia de la mesa --- */
let isDragging = false, dragMoved = false, startX = 0, startTrackX = 0, lastX = 0, lastTime = 0, velocity = 0, rafId = null;
function clientX(e) { return e.type.includes('touch') ? ((e.touches && e.touches.length) ? e.touches[0].clientX : e.changedTouches[0].clientX) : e.clientX; }
windowEl.addEventListener('touchstart', dragStart, { passive: true });
windowEl.addEventListener('touchend', dragEnd);
windowEl.addEventListener('touchmove', dragMove, { passive: false });
windowEl.addEventListener('mousedown', dragStart);
windowEl.addEventListener('mouseup', dragEnd);
windowEl.addEventListener('mouseleave', dragEnd);
windowEl.addEventListener('mousemove', dragMove);
function dragStart(e) {
  if (isFlipped) return;
  cancelAnimationFrame(rafId);
  isDragging = true; dragMoved = false; startX = clientX(e); lastX = startX; lastTime = Date.now(); velocity = 0; startTrackX = trackX; track.style.transition = 'none';
}
function dragMove(e) {
  if (!isDragging) return;
  const x = clientX(e); const diff = x - startX;
  if (Math.abs(diff) > 8) { dragMoved = true; if (e.cancelable) e.preventDefault(); }
  const now = Date.now(); const dt = now - lastTime;
  if (dt > 0) velocity = (x - lastX) / dt;
  lastX = x; lastTime = now; trackX = startTrackX + diff; applyTrackPosition(false);
}
function dragEnd() {
  if (!isDragging) return;
  isDragging = false;
  if (!dragMoved) { snapToNearest(); return; }
  velocity = Math.max(-2.2, Math.min(2.2, velocity));
  startMomentum();
}
function startMomentum() {
  let lastTs = null;
  function step(ts) {
    if (!lastTs) lastTs = ts;
    const dt = Math.min(ts - lastTs, 48); lastTs = ts;
    trackX += velocity * dt; velocity *= Math.pow(0.945, dt / 16.67);
    wrapIfNeeded(); applyTrackPosition(false);
    if (Math.abs(velocity) > 0.015) rafId = requestAnimationFrame(step); else snapToNearest();
  }
  rafId = requestAnimationFrame(step);
}
function snapToNearest() { currentIndex = Math.round(indexForPosition(trackX)); trackX = positionForIndex(currentIndex); applyTrackPosition(true); }
window.addEventListener('resize', () => { if (actual) { trackX = positionForIndex(currentIndex); applyTrackPosition(false); } });

/* =====================================================================
   ARRANQUE
   ===================================================================== */
// Vídeo de cabecera: versión ligera en móvil; imagen fija si el sistema pide menos movimiento
(function () {
  const v = document.getElementById('video-cabecera');
  if (!v) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const base = window.innerWidth <= 700 ? 'video/cabecera-movil' : 'video/cabecera';
  // MP4 para iPhone, iPad, Android y Chrome; WebM de respaldo para navegadores sin H.264
  v.innerHTML = `<source src="${base}.mp4" type="video/mp4"><source src="${base}.webm" type="video/webm">`;
  v.muted = true;
  v.load();
  const p = v.play(); if (p && p.catch) p.catch(() => {});
})();

activarArrastre(document.getElementById('fila-todos'));
activarArrastre(document.getElementById('fila-coleccion'));
pintar();   // al instante se pinta lo que está abierto para todos

(async function arrancar() {
  dispositivo = await obtenerDispositivo();
  coleccion = await leerColeccion();
  if (Object.keys(coleccion).length) guardarColeccion();   // autocura: se copia en los tres sitios
  await verificarColeccion();
  pintar();
  if (validas.size) pedirPersistencia();
  await licenciaDesdeEnlace();
  recuperarDelServidor();
  recomprobarLicencias();
})();
